# Broker edge opzionale. La via principale è che i sensori pubblichino
# direttamente sul listener MQTT di RabbitMQ: un hop solo, niente bridge.
# Mosquitto serve se si vuole un broker locale in campo; il bridge in fondo
# inoltra farm/# verso RabbitMQ ed è commentato di default.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type notice

listener 1883
protocol mqtt

# websockets per debug da browser, sull'host è la 9101 (la 9001 è occupata)
listener 9001
protocol websockets

# anonimo perché non è nella catena dati principale. In produzione:
# allow_anonymous false + password_file generato con mosquitto_passwd
allow_anonymous true

# Bridge verso RabbitMQ, da scommentare nello scenario edge. Il topic resta
# farm/<campo>/<tipo>, che su RabbitMQ diventa farm.<campo>.<tipo>.
# connection bridge-rabbitmq
# address rabbitmq:1883
# remote_username agri
# remote_password agri
# bridge_protocol_version mqttv311
# cleansession true
# try_private false
# # telemetria in uscita, comandi in entrata
# topic farm/# out 1
# topic farm/+/cmd in 1
# restart_timeout 5
