## RabbitMQ di sviluppo: code AMQP durable, exchange topic e listener MQTT
## per i sensori.

## credenziali dev, non per la produzione
default_user = agri
default_pass = agri
default_vhost = /

## guest solo da localhost
loopback_users.guest = true

## exchange, code e binding creati all'avvio
load_definitions = /etc/rabbitmq/definitions.json

## Listener MQTT: i sensori pubblicano qui e i messaggi finiscono su amq.topic,
## con lo "/" del topic che diventa "." nella routing key.
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = false
mqtt.default_user = agri
mqtt.default_pass = agri
mqtt.vhost = /

listeners.tcp.default = 5672
